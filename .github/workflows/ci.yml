#
# CREWCOMP verification lanes (ADR 0004, spec §17.3).
#
# One workflow per concern, and this one is "does the change hold up". The deploy lane is not here
# and cannot be: ADR 0005 has not chosen between AWS and GCP, and the ADR says the concrete deploy
# lane lands with that verdict. So does the preview environment (DEV-4, Neon branch database) and
# the image scanning that needs an image to scan.
#
# What is here is every command the three components' CLAUDE.md files tell a developer to run, made
# non-optional. Three of the lanes exist because a human cannot reliably run them at all:
#
#   * **Android** (`mobile-android`). There is no Android SDK on the development machine, so ADR
#     0002's feature-parity mandate has never been checked. This runner is the only thing that will
#     ever enforce it, which makes this the single most load-bearing job in the file.
#   * **Native image** (`backend-native`). No GraalVM locally either (ADR 0001 makes it a per-merge
#     job). Reflection registration for the entity and DTO graph is the expected first failure.
#   * **The generated-types checks**. `npm run verify:api` and `generate_api.dart --check` fail when
#     a client's committed types have drifted from the backend's OpenAPI schema (DEV-2). They catch
#     the specific mistake of changing a DTO and forgetting a client — which happened while ADM-8/9/10
#     were being built, in the direction nobody thinks of: an admin-only DTO made *mobile's* types
#     stale.
#
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a red main can be re-checked without an empty commit.
  workflow_dispatch:

# A force-push or a second push to a PR makes the first run's answer irrelevant. Cancel it — except
# on main, where every commit's result is a record worth having.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # backend/ — Kotlin + Quarkus
  # ---------------------------------------------------------------------------
  backend:
    name: backend — verify + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # No DOCKER_HOST or TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE here, deliberately: a GitHub runner
      # has a native Docker socket at the conventional path. Those two variables exist only because
      # Colima does not, and setting them here would break the thing they fix locally.
      - name: Verify with integration tests
        run: ./mvnw --batch-mode --no-transfer-progress verify -DskipITs=false
        working-directory: backend

      # The OpenAPI schema the clients generate from. Published so the client jobs below can check
      # their committed types against *this* build rather than against a schema they built themselves
      # — which would let a stale committed file pass by being regenerated in the same run.
      - name: Publish the OpenAPI schema
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: backend/target/openapi/openapi.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # backend/ — GraalVM native image (ADR 0001)
  # ---------------------------------------------------------------------------
  backend-native:
    name: backend — native image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only on main and on demand. A native build is ~15–40 minutes and its failure mode — missing
    # reflection registration — does not vary per commit the way a test failure does, so paying for
    # it on every PR push would slow the loop without catching more.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm-community
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the native image
        run: ./mvnw --batch-mode --no-transfer-progress -Dnative verify -DskipITs=false
        working-directory: backend

  # ---------------------------------------------------------------------------
  # admin-web/ — React + TypeScript
  # ---------------------------------------------------------------------------
  admin-web:
    name: admin-web — types, build, tests, dev-shim check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - run: npm ci
        working-directory: admin-web

      - name: Fetch the backend's OpenAPI schema
        uses: actions/download-artifact@v4
        with:
          name: openapi-schema
          path: openapi

      # DEV-2: the committed types must match the schema this run built. `CREWCOMP_OPENAPI` points
      # the generator at the artefact instead of at a local backend build.
      - name: Check the generated types are current
        run: npm run verify:api
        working-directory: admin-web
        env:
          CREWCOMP_OPENAPI: ${{ github.workspace }}/openapi/openapi.json

      # `build` is `tsc --noEmit && vite build`, so this is the type check as well as the bundle.
      - run: npm run build
        working-directory: admin-web

      - run: npm test
        working-directory: admin-web

      # The development auth shim is stripped by `import.meta.env.DEV` being a compile-time
      # constant. That guarantee holds until someone moves the constant behind a runtime check, at
      # which point the bundle would carry a header-authentication path into production — so it is
      # asserted rather than trusted.
      - name: Assert the dev auth shim is absent from the bundle
        run: |
          if grep -r --quiet 'X-Dev-Roles' dist/; then
            echo "::error file=admin-web/src/api/client.ts::The production bundle contains the" \
                 "development auth shim's header. It must be stripped at build time (SEC-1)."
            grep -rl 'X-Dev-Roles' dist/
            exit 1
          fi
          echo "No dev-shim header in the bundle."
        working-directory: admin-web

  # ---------------------------------------------------------------------------
  # mobile/ — Flutter, analysis and tests
  # ---------------------------------------------------------------------------
  mobile:
    name: mobile — types, analyze, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: mobile

      - name: Fetch the backend's OpenAPI schema
        uses: actions/download-artifact@v4
        with:
          name: openapi-schema
          path: openapi

      # `dart` here is Flutter's own, which is the point: a standalone Dart of a different version
      # fails inside a native build hook with "Invalid kernel binary format version", an error that
      # reads like a corrupt package rather than a version mismatch. `flutter-action` puts the
      # matching one on the PATH.
      - name: Check the generated types are current
        run: dart run tool/generate_api.dart --check
        working-directory: mobile
        env:
          CREWCOMP_OPENAPI: ${{ github.workspace }}/openapi/openapi.json

      - run: flutter analyze
        working-directory: mobile

      - run: flutter test
        working-directory: mobile

  # ---------------------------------------------------------------------------
  # mobile/ — Android build (ADR 0002's parity mandate)
  # ---------------------------------------------------------------------------
  mobile-android:
    name: mobile — Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: mobile

      # MOB-0 makes iOS/Android feature parity a hard requirement, and this repository has never
      # built the Android half — there is no Android SDK on the development machine. A debug APK is
      # the cheapest artefact that proves the Android toolchain, the Gradle configuration and every
      # plugin's Android implementation actually resolve. `--debug` because signing a release build
      # needs a keystore, which is the mobile spike's.
      - name: Build a debug APK
        run: flutter build apk --debug
        working-directory: mobile

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # mobile/ — iOS build
  # ---------------------------------------------------------------------------
  mobile-ios:
    name: mobile — iOS build
    runs-on: macos-latest
    timeout-minutes: 40
    needs: mobile
    # macOS runners are billed at ten times the Linux rate, so this runs on main and on demand. The
    # iOS build is also the one a developer *can* run locally (Xcode 26.6 is installed), which is the
    # opposite of the Android lane's situation.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: mobile

      # `--no-codesign`: signing needs an Apple Developer identity, which is the mobile spike's.
      - name: Build for iOS
        run: flutter build ios --no-codesign --debug
        working-directory: mobile
