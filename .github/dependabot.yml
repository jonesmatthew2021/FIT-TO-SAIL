#
# Dependency updates (ADR 0004), grouped.
#
# Grouped rather than one PR per dependency, for a specific reason beyond volume: this repository's
# CI is the review. Twenty single-dependency PRs a week means twenty full CI runs and twenty
# decisions, which is how a one-person team ends up merging updates without reading them. One grouped
# PR per ecosystem per week is one run and one decision, and the decision is an informed one.
#
# Majors are deliberately *not* grouped with minors. A major is a change to read, and burying one in
# a group of fourteen patch bumps is how a breaking change arrives unnoticed.
#
version: 2

updates:
  # --- backend: Maven ------------------------------------------------------
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      quarkus:
        # The platform BOM moves as a unit; splitting it produces PRs that cannot pass.
        patterns:
          - 'io.quarkus*'
          - 'io.quarkiverse*'
        update-types: [minor, patch]
      kotlin:
        patterns:
          - 'org.jetbrains.kotlin*'
        update-types: [minor, patch]
      other-minor-and-patch:
        patterns: ['*']
        exclude-patterns:
          - 'io.quarkus*'
          - 'io.quarkiverse*'
          - 'org.jetbrains.kotlin*'
        update-types: [minor, patch]

  # --- admin-web: npm -----------------------------------------------------
  #
  # §14.3's research rejected React Native partly on npm's 2025–26 supply-chain record, and the same
  # argument applies to this tree. The dependency list is deliberately short; keep it that way, and
  # read what these PRs actually change.
  - package-ecosystem: npm
    directory: /admin-web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom', 'react-router-dom']
        update-types: [minor, patch]
      build-tooling:
        patterns: ['vite', '@vitejs/*', 'vitest', 'typescript', 'jsdom', 'openapi-typescript']
        update-types: [minor, patch]
      other-minor-and-patch:
        patterns: ['*']
        exclude-patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
          - 'react-router-dom'
          - 'vite'
          - '@vitejs/*'
          - 'vitest'
          - 'typescript'
          - 'jsdom'
          - 'openapi-typescript'
        update-types: [minor, patch]

  # --- mobile: pub --------------------------------------------------------
  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      all-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  # --- the workflows themselves -------------------------------------------
  #
  # A pinned action is a dependency like any other, and an unmaintained one in a workflow with write
  # permissions is a supply-chain problem with a shorter path to production than any library here.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
