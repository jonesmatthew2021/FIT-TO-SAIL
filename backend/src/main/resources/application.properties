### CREWCOMP backend configuration
#
# SEC-9: no secrets here. Anything sensitive comes from the managed secret store via the
# SecretsProvider adapter, or from the environment. Values below are non-secret defaults.

quarkus.application.name=crewcomp-backend
quarkus.http.port=8080

# NFR-5 / O-11: all business dates are calendar dates in the operating timezone.
crewcomp.operating-timezone=Australia/Perth

# §1: the admin-only date override for testing and audit reconstruction. Refused in production
# unless deliberately enabled, because a wrong "today" silently changes every compliance answer.
crewcomp.date-override.allowed-in-production=false

### Database ---------------------------------------------------------------------------------
# PostgreSQL >= 15 (the baseline migration uses UNIQUE NULLS NOT DISTINCT).
quarkus.datasource.db-kind=postgresql

# Flyway owns the schema. Hibernate validates against it and never writes DDL: migrations are
# forward-only and expand/contract, so a Hibernate-generated ALTER would break the rule that a
# migration must run against the previous application revision.
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=false
quarkus.flyway.locations=db/migration

### Identity — SEC-1 / SEC-1a / ADR 0003 ------------------------------------------------------
# Corporate SSO is the sole authentication path. Each allow-listed backend is a quarkus-oidc
# tenant; the `identity_provider` table is the runtime allow-list and ActorResolver re-checks
# issuer + tenant/domain on EVERY token, not just at first login.
#
# One block per onboarded backend, for example:
#   quarkus.oidc.entra-acme.auth-server-url=https://login.microsoftonline.com/<tenant-id>/v2.0
#   quarkus.oidc.entra-acme.client-id=<client-id>
#   quarkus.oidc.google-acme.auth-server-url=https://accounts.google.com
#   quarkus.oidc.okta-acme.auth-server-url=https://<org>.okta.com
#
# Entra tenants must use the per-tenant issuer — never /common or /organizations (ADR 0003).
quarkus.oidc.tenant-enabled=false

# The local-development authentication shim (see DevAuth). This is a BUILD-time property: with
# it false the mechanism bean is not in the artefact at all, so a production image cannot be
# talked into header authentication by a runtime override. It is switched on only under the dev
# and test profiles below, and start-up fails outright if it is ever true under `prod`.
crewcomp.dev-auth.enabled=false

# The development data fixture (see DevDataSeeder). Also build-time, also dev-only, and it
# refuses to run against a database that already holds people. It is NOT the §11 migration.
crewcomp.dev-seed.enabled=false

### MCP server — §13.1 ------------------------------------------------------------------------
# MCP-3: disabled by default. Dev and staging enable it; production does not.
crewcomp.mcp.enabled=false
crewcomp.mcp.allow-writes=false
crewcomp.mcp.agent-label=Claude Code (MCP)

# MCP-4: the endpoint is bearer-token authenticated in EVERY environment (McpHttpAuthentication),
# and the application refuses to start with MCP enabled and no token. Supply it from the
# environment or the secret store — never commit one.
#   crewcomp.mcp.token=${CREWCOMP_MCP_TOKEN}

### Operability — NFR-6 -----------------------------------------------------------------------
quarkus.log.console.json=false
quarkus.http.access-log.enabled=true
quarkus.smallrye-health.root-path=/health

### OpenAPI — DEV-2 (admin SPA and mobile types are generated from this schema) ---------------
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.info-title=CREWCOMP API
quarkus.smallrye-openapi.info-version=v1
# Written at build time so `admin-web` can regenerate its types from a file, without a running
# server. `admin-web/scripts/generate-api-types.sh` reads target/openapi/openapi.json and CI
# fails if the committed types no longer match it.
quarkus.smallrye-openapi.store-schema-directory=target/openapi

### Dev ---------------------------------------------------------------------------------------
%dev.quarkus.http.host=127.0.0.1
%dev.crewcomp.mcp.enabled=true
%dev.crewcomp.mcp.allow-writes=true
# Dev token comes from the environment; `quarkus dev` fails fast without it (MCP-4).
%dev.crewcomp.mcp.token=${CREWCOMP_MCP_TOKEN:}
# Dev Services starts a throwaway PostgreSQL; requires a container runtime.
%dev.quarkus.datasource.devservices.image-name=postgres:16
# No corporate IdP locally: the OIDC tenants are configured per environment. The dev shim stands
# in for the BFF session until the identity spike builds it, so the admin SPA can be developed.
%dev.quarkus.oidc.enabled=false
%dev.crewcomp.dev-auth.enabled=true
%dev.crewcomp.dev-auth.default-roles=crew_coordinator,workflow_manager,compliance_lead,data_steward
%dev.crewcomp.dev-seed.enabled=true
# No CORS configuration, deliberately: the Vite dev server proxies /api to this port, so the
# browser sees a single origin exactly as it will in production. Enabling cross-origin
# credentialed requests for development would exercise a cookie policy production never uses,
# and would be one override away from shipping.

### Test --------------------------------------------------------------------------------------
%test.quarkus.oidc.enabled=false
# Enabled so the API-level ITs can authenticate; no default roles, so a test that does not name
# them explicitly is anonymous and proves the endpoint really is protected.
%test.crewcomp.dev-auth.enabled=true
%test.crewcomp.dev-auth.default-roles=
%test.crewcomp.mcp.enabled=true
%test.crewcomp.mcp.allow-writes=true
%test.crewcomp.mcp.token=test-token-not-a-secret-0123456789abcdef
%test.quarkus.datasource.devservices.image-name=postgres:16

### Production --------------------------------------------------------------------------------
# MCP-3: off in production. Any enablement is an explicit, audited, time-boxed act, and
# read-only diagnostics at most (posture pending O-18).
%prod.crewcomp.mcp.enabled=false
%prod.crewcomp.mcp.allow-writes=false
%prod.quarkus.log.console.json=true
